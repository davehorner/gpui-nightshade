<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>gpui-nightshade · GPUI + Nightshade Web Viewer</title>
<style>html,body,.root{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1220;color:#dce9f7;font:15px system-ui}.main-canvas{width:100%;height:100%;display:block}#boot{position:fixed;inset:0;display:grid;place-content:center;padding:2rem;white-space:pre-wrap}#boot[hidden]{display:none}</style>
<div id="boot">Loading Nightshade WebGPU viewer…</div>
<script type="module">
import {startup} from './startup.js?v=__BUILD_ID__';
const diag=startup(document.querySelector('#boot'),'Nightshade','__BUILD_ID__');
try {
  await diag.check();diag.phase('Downloading and compiling the GPUI/Nightshade WASM module');
  const runtime=await import('./pkg/__BUILD_ID__/nightshade.js');await runtime.default();
  diag.phase('Starting the GPUI interface');runtime.run(new URLSearchParams(location.search).get('model'));diag.appReady();
}catch(error){diag.fail(error);}
</script></html>
