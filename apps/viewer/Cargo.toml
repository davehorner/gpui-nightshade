[package]
name = "gpui-nightshade-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gpui-nightshade-components = { path = "../../crates/gpui-nightshade-components" }

gpui-nightshade = {path="../../crates/gpui-nightshade"}
nightshade-viewer-core = {path="../../crates/nightshade-viewer-core"}

ehttp = "0.7"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[lib]
name = "gpui_nightshade_web"
crate-type = ["cdylib", "rlib"]

[dependencies.gpui-kit]
path = "../../upstream/gpui-component/crates/kit"

[dependencies.web-time]
version = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "0.2"
log = "0.4"
