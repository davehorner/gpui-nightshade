name: Publish WASM to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust toolchains
        shell: pwsh
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.100.0
          rustup toolchain install nightly-2026-10-31 --profile minimal --target wasm32-unknown-unknown
      - name: Initialize pinned source dependencies
        run: python scripts/prepare.py
      - name: Cache complete Rust build outputs
        uses: actions/cache@v4
        with:
          path: |
            target
          key: pages-target-v1-${{ runner.os }}-rust-1.100.0-nightly-2026-10-31-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/config.toml', '**/rust-toolchain*') }}-${{ github.sha }}
          restore-keys: |
            pages-target-v1-${{ runner.os }}-rust-1.100.0-nightly-2026-10-31-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/config.toml', '**/rust-toolchain*') }}-
            pages-target-v1-${{ runner.os }}-rust-1.100.0-nightly-2026-10-31-
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.130
      - name: Check browser startup diagnostics
        run: |
          node web/test-startup.mjs
          node web/test-touch.mjs
      - name: Build WASM site
        run: python web/build.py --out dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
