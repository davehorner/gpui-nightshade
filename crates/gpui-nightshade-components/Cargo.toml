[package]
name = "gpui-nightshade-components"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gpui-nightshade = { path = "../gpui-nightshade" }
gpui-kit = { path = "../../upstream/gpui-component/crates/kit" }
image = { version = "0.25", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
gpui-windows = { package = "gpui-pre-windows", version = "=0.3.14" }
windows = { version = "0.62", features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Security"] }
